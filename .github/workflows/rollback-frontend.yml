name: Rollback Frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión o tag de imagen a restaurar (ej: v1.0.123 o sha-abc1234)'
        required: true
        type: string
      reason:
        description: 'Razón del rollback'
        required: true
        type: string

env:
  DOCKERHUB_ORG: retrogamehub
  K8S_REPO: retrogamecloud/kubernetes
  K8S_MANIFEST_FILE: 04-frontend.yaml
  ARGOCD_MANIFEST_FILE: argocd/base/frontend-deployment.yaml

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validar que la imagen existe en Docker Hub
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SERVICE="${{ github.event.repository.name }}"
          
          # Verificar si la imagen existe
          if docker manifest inspect ${{ env.DOCKERHUB_ORG }}/${SERVICE}:${VERSION} > /dev/null 2>&1; then
            echo "✅ Imagen ${{ env.DOCKERHUB_ORG }}/${SERVICE}:${VERSION} encontrada"
          else
            echo "❌ Error: La imagen ${{ env.DOCKERHUB_ORG }}/${SERVICE}:${VERSION} no existe"
            exit 1
          fi

      - name: Clonar repositorio de Kubernetes
        uses: actions/checkout@v6
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8S_UPDATE_TOKEN }}
          ref: main

      - name: Rollback a versión anterior
        run: |
          VERSION="${{ github.event.inputs.version }}"
          REASON="${{ github.event.inputs.reason }}"
          SERVICE="${{ github.event.repository.name }}"
          
          # Actualizar manifiesto de Kubernetes
          sed -i "s|image: ${{ env.DOCKERHUB_ORG }}/${SERVICE}:.*|image: ${{ env.DOCKERHUB_ORG }}/${SERVICE}:${VERSION}|g" ${{ env.K8S_MANIFEST_FILE }}
          sed -i "s|# Imagen del ${SERVICE} desde DockerHub.*|# Imagen del ${SERVICE} desde DockerHub - ROLLBACK a ${VERSION}|g" ${{ env.K8S_MANIFEST_FILE }}
          
          # Actualizar manifiesto de ArgoCD
          sed -i "s|image: ${{ env.DOCKERHUB_ORG }}/${SERVICE}:.*|image: ${{ env.DOCKERHUB_ORG }}/${SERVICE}:${VERSION}|g" ${{ env.ARGOCD_MANIFEST_FILE }}
          sed -i "s|# Imagen de ${SERVICE} desde DockerHub.*|# Imagen de ${SERVICE} desde DockerHub - ROLLBACK a ${VERSION}|g" ${{ env.ARGOCD_MANIFEST_FILE }}
          
          echo "✅ Manifiestos actualizados con imagen: ${VERSION}"

      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Aplicar cambios (PR o directo según modo de emergencia)
        run: |
          VERSION="${{ github.event.inputs.version }}"
          REASON="${{ github.event.inputs.reason }}"
          SERVICE="${{ github.event.repository.name }}"
          
          git add ${{ env.K8S_MANIFEST_FILE }} ${{ env.ARGOCD_MANIFEST_FILE }}
          
          # Verificar si hay cambios
          if git diff --staged --quiet; then
            echo "⚠️ No hay cambios en el manifiesto"
            exit 0
          fi
          
          # Crear PR para revisión
          BRANCH_NAME="rollback/${SERVICE}-${VERSION}-$(date +%s)"
          
          git checkout -b "${BRANCH_NAME}"
          
          git commit -m "🔙 ROLLBACK: Restaurar ${SERVICE} a ${VERSION}" \
                     -m "Razón: ${REASON}" \
                     -m "Ejecutado por: ${{ github.actor }}" \
                     -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          git push origin "${BRANCH_NAME}"
          
          gh pr create \
            --repo ${{ env.K8S_REPO }} \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "🔙 ROLLBACK: ${SERVICE} a ${VERSION}" \
            --body "Rollback de ${SERVICE} - Version: ${VERSION}, Razon: ${REASON}, Ejecutado por: ${{ github.actor }}" \
            --label rollback --label urgent
          
          echo "✅ PR de rollback creado. Aprobar para que ArgoCD sincronice."
        env:
          GH_TOKEN: ${{ secrets.K8S_UPDATE_TOKEN }}

      - name: Notificar resultado
        run: |
          echo "## ✅ Rollback Iniciado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Versión restaurada**: ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Razón**: ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ejecutado por**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Acción requerida**: Aprobar el PR → ArgoCD sincronizará automáticamente" >> $GITHUB_STEP_SUMMARY
